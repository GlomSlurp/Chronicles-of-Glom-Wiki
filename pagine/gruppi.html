<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gruppi - Wiki</title>
    <link rel="stylesheet" href="../styles/wiki_style.css" />
    <link rel="website icon" type="png" href="../images/Chronicles_logo.png"/>
</head>

<body>

<header>
    <div class="title">Chronicles Of Glom</div>
    <div class="subtitle">Wiki – Gruppi</div>
</header>

<main class="wiki-layout">

    <aside class="sidebar">
        <h3>Sezioni</h3>
        <ul>
            <li><a href="../wiki.html">Pagina Principale</a></li>
            <li><a href="persone.html">Persone</a></li>
            <li><a href="creature.html">Creature</a></li>
            <li><a href="luoghi.html">Luoghi</a></li>

        </ul>

    <article class="content">
        <h1>Gruppi</h1>

        <div id="lista-gruppi"></div>

    </article>

</main>

<footer>
    <small>&copy; D&D Campaign Manager</small>
</footer>

<script>
// Carica il JSON dei gruppi
fetch("../data/gruppi.json")
    .then(response => response.json())
    .then(data => {
        const container = document.getElementById("lista-gruppi");

        data.forEach(item => {
            const p = document.createElement("p");
            p.innerHTML = `
                <a href="pagina.html?file=gruppi&slug=${item.slug}">
                    ${item.nome}
                </a>
            `;
            container.appendChild(p);
        });
    })
    .catch(err => {
        console.error("Errore nel caricamento del JSON:", err);
    });
</script>

</body>
</html>
