<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Wiki</title>
    <link rel="stylesheet" href="../styles/wiki_style.css" />
    <link rel="website icon" type="png" href="../images/Chronicles_logo.png"/>
</head>

<body>

<header>
    <div class="title">Chronicles Of Glom</div>
    <div class="subtitle" id="subtitle">Wiki</div>

</header>

<main class="wiki-layout">

    <aside class="sidebar">
        <h3>Indice</h3>
        <ul>
            <li><a href="../index.html">Pagina Principale</a></li>
            <li><a id="back-category" href="#">Torna alla categoria</a></li>
        </ul>
    </aside>

    <article class="content">

        <div id="infobox"></div>

        <h1 id="nome"></h1>

        <div class="lore-text" id="contenuto"></div>

    </article>

</main>

<footer>
    <small><span id="currentYear"></span> &copy; D&D Campaign Manager</small>
    <script>
    // Imposta l'anno corrente nel footer
    document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
</footer>

<script>
// --- 1. Legge parametri dalla URL ---
const params = new URLSearchParams(window.location.search);
const file = params.get("file");
const slug = params.get("slug");

// Link "torna alla categoria"
document.getElementById("back-category").href = `${file}.html`;

// --- 2. Carica il JSON corretto ---
fetch(`../data/${file}.json`)
    .then(r => r.json())
    .then(data => {
        const pagina = data.find(item => item.slug === slug);

        if (!pagina) {
            document.querySelector(".content").innerHTML = "<p>Pagina non trovata.</p>";
            return;
        }

        // --- 3. Popola la pagina ---
        document.getElementById("page-title").textContent = `${pagina.nome} - Wiki`;
        document.getElementById("subtitle").textContent = `Wiki – ${pagina.nome}`;
        document.getElementById("nome").textContent = pagina.nome;
        document.getElementById("contenuto").innerHTML = pagina.contenuto;

        // Immagine (se presente)
        if (pagina.immagine && pagina.immagine.trim() !== "") {
            document.getElementById("infobox").innerHTML = `
                <div class="infobox">
                    <img src="../images/${pagina.immagine}" alt="">
                </div>
            `;
        }
    })
    .catch(err => {
        console.error("Errore nel caricamento:", err);
        document.querySelector(".content").innerHTML = "<p>Errore nel caricamento della pagina.</p>";
    });

// Anteprima immagine al passaggio del mouse per i link interni
document.addEventListener("mouseover", function(event) {
    if (event.target.tagName === "A" && event.target.href.includes("file=")) {
        const urlParams = new URLSearchParams(event.target.search);
        const linkFile = urlParams.get("file");
        const linkSlug = urlParams.get("slug");

        fetch(`../data/${linkFile}.json`)
            .then(response => response.json())
            .then(data => {
                const item = data.find(i => i.slug === linkSlug);
                if (item && item.immagine) {
                    let preview = document.getElementById("image-preview");
                    if (!preview) {
                        preview = document.createElement("img");
                        preview.id = "image-preview";
                        preview.style.position = "absolute";
                        preview.style.border = "1px solid #ccc";
                        preview.style.background = "#fff";
                        preview.style.padding = "5px";
                        document.body.appendChild(preview);
                    }
                    preview.src = `../images/${item.immagine}`;
                    preview.style.top = (event.pageY + 10) + "px";
                    preview.style.left = (event.pageX + 10) + "px";
                    preview.style.display = "block";
                }
            });
    }
});
</script>

</body>
</html>
