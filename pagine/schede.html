    <aside class="sidebar">

<footer>
    <small><span id="currentYear"></span> &copy; D&D Campaign Manager</small>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
</footer>

<script>
// Carica il JSON e genera la lista
fetch("../data/schede.json")
    .then(response => response.json())
    .then(data => {
        const container = document.getElementById("lista-schede");

        data.forEach(item => {
            const p = document.createElement("p");
p.innerHTML = `
                <a href="pagina.html?file=schede&slug=${item.slug}">
                    ${item.nome}
                </a>
            `;
            container.appendChild(p);
        });
    })
    .catch(err => {
        console.error("Errore nel caricamento del JSON:", err);
    });
</script>

</body>
</html>
