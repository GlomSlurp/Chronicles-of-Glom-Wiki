<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica Articolo</title>
    <link rel="stylesheet" href="../styles/wiki_style.css">
    <link rel="website icon" type="png" href="../images/Chronicles_logo.png"/>

    <!-- TinyMCE -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js"></script>

    <script>

    // 🔧 TinyMCE
    tinymce.init({
        selector: 'textarea[name=contenuto]',
        height: 500,
        plugins: 'formatpainter link image lists table code accordion',
        toolbar: 'undo redo | copy paste formatpainter | bold italic underline | bullist numlist | link image | table | code | accordion',
        details_serialized_state: 'collapsed',
        setup: function (editor) {
            editor.on('change keyup', function () {
                editor.save();
            });
        }
    });
    </script>
</head>

<body>

<header>
    <div class="title">Chronicles Of Glom</div>
    <div class="subtitle">Modifica Articolo</div>

    <nav>
        <a href="wiki_admin.html">Pannello</a>
    </nav>
</header>

<main class="wiki-layout">

    <article class="content">
        <h1>Modifica Articolo</h1>

        <form id="editForm">

            <label>Sezione</label>
            <select name="file" id="fileSelect" required>
                <option value="persone">Persone</option>
                <option value="creature">Creature</option>
                <option value="luoghi">Luoghi</option>
                <option value="lore">Lore</option>
                <option value="gruppi">Gruppi</option>
                <option value="geografia">Geografia</option>
                <option value="divinita">Divinità</option>
            </select>

            <label>Nome</label>
            <input type="text" name="nome" id="nome" required>

            <label>Slug</label>
            <input type="text" name="slug" id="slug" required>

            <label>Immagine</label>
            <input type="text" name="immagine" id="immagine">

            <label>Contenuto</label>
            <textarea name="contenuto" id="contenuto" required></textarea>

            <button type="submit">Salva Modifiche</button>
        </form>

    </article>

</main>

<footer>
    <small>&copy; D&D Campaign Manager</small>
</footer>

<script>
// 🔥 Estrae parametri da URL
const params = new URLSearchParams(window.location.search);
const file = params.get("file");
const slug = params.get("slug");

// 🔥 Carica l’articolo da modificare
async function loadArticle() {
    const res = await fetch(`../../data/${file}.json`);
    const data = await res.json();

    const articolo = data.find(a => a.slug === slug);
    if (!articolo) {
        alert("Articolo non trovato.");
        window.location.href = "wiki_admin.html";
        return;
    }

    document.getElementById("fileSelect").value = file;
    document.getElementById("nome").value = articolo.nome;
    document.getElementById("slug").value = articolo.slug;
    document.getElementById("immagine").value = articolo.immagine;
    document.getElementById("contenuto").value = articolo.contenuto;

    // TinyMCE deve aggiornarsi dopo il caricamento
    setTimeout(() => {
        tinymce.get("contenuto").setContent(articolo.contenuto);
    }, 300);
}

loadArticle();

// 🔥 Salva modifiche tramite Netlify Function
document.getElementById("editForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const form = new FormData(e.target);

    const payload = {
        oldSlug: slug,
        file: form.get("file"),
        nome: form.get("nome"),
        slug: form.get("slug"),
        immagine: form.get("immagine"),
        contenuto: form.get("contenuto")
    };

    const res = await fetch("/.netlify/functions/editArticle", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });

    const json = await res.json();

    if (json.success) {
        alert("Modifiche salvate!");
        window.location.href = "wiki_admin.html";
    } else {
        alert("Errore: " + json.error);
    }
});
</script>

</body>
</html>
