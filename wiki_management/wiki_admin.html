<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Pannello Gestione - Wiki</title>
    <link rel="stylesheet" href="../styles/wiki_style.css">
    <link rel="website icon" type="png" href="../images/Chronicles_logo.png"/>
</head>

<body>

<header>
    <div class="title">Chronicles Of Glom</div>
    <div class="subtitle">Pannello Gestione</div>

    <nav>
        <a href="../index.html">Wiki</a>
        <a class="active">Pannello</a>
        <a href="wiki_add.html">Aggiungi Articolo</a>
    </nav>
</header>

<main class="wiki-layout">

    <article class="content">
        <h1>Gestione Articoli</h1>

        <div id="admin-container"></div>

    </article>

</main>

<footer>
    <small>&copy; D&D Campaign Manager</small>
</footer>

<script>

// 🔧 Sezioni disponibili
const sezioni = [
    "persone",
    "creature",
    "luoghi",
    "lore",
    "gruppi",
    "geografia",
    "divinita"
];

// 🔥 Carica tutti i JSON e genera il pannello
async function loadAdminPanel() {
    const container = document.getElementById("admin-container");

    for (const sezione of sezioni) {
        const h2 = document.createElement("h2");
        h2.textContent = sezione.charAt(0).toUpperCase() + sezione.slice(1);
        container.appendChild(h2);

        try {
            const res = await fetch(`../../data/${sezione}.json`);
            if (!res.ok) {
                container.innerHTML += `<p class="muted">⚠ Il file ${sezione}.json non esiste.</p>`;
                continue;
            }

            const data = await res.json();

            if (!Array.isArray(data) || data.length === 0) {
                container.innerHTML += `<p class="muted">Nessun articolo presente.</p>`;
                continue;
            }

            data.forEach(item => {
                const p = document.createElement("p");
                p.innerHTML = `
                    <strong>${item.nome}</strong>
                    — <a href="wiki_edit.html?file=${sezione}&slug=${item.slug}">Modifica</a>
                    — <a href="#" onclick="deleteArticle('${sezione}', '${item.slug}')">Elimina</a>
                `;
                container.appendChild(p);
            });

        } catch (err) {
            container.innerHTML += `<p class="muted">Errore nel caricamento di ${sezione}.json</p>`;
        }
    }
}

// 🔥 Funzione per eliminare un articolo tramite Netlify Function
async function deleteArticle(file, slug) {
    if (!confirm("Eliminare questo articolo?")) return;

    const res = await fetch("/.netlify/functions/deleteArticle", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ file, slug })
    });

    const json = await res.json();

    if (json.success) {
        alert("Articolo eliminato.");
        location.reload();
    } else {
        alert("Errore: " + json.error);
    }
}

loadAdminPanel();
</script>

</body>
</html>
